<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-cols="3">

  <!-- ══ TOP BAR ══════════════════════════════════════════════════ -->
  <header class="topbar">
    <a class="topbar-logo" href="#">
      <div class="logo-spark">✦</div>
      Prompt Gallery
    </a>

    <div class="topbar-right">

      <!-- Column switcher: 1 / 2 / 3 / 4 — hidden on mobile via CSS -->
      <div class="col-switcher desktop-only" role="group" aria-label="Grid columns">

        <button class="col-btn" data-col="1" title="1 column" aria-label="1 column">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="3" y="2" width="10" height="12" rx="1.5" fill="currentColor"/>
          </svg>
        </button>

        <button class="col-btn" data-col="2" title="2 columns" aria-label="2 columns">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="2" y="2" width="5" height="12" rx="1.5" fill="currentColor"/>
            <rect x="9" y="2" width="5" height="12" rx="1.5" fill="currentColor"/>
          </svg>
        </button>

        <button class="col-btn active" data-col="3" title="3 columns" aria-label="3 columns">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="1"  y="2" width="4" height="12" rx="1.5" fill="currentColor"/>
            <rect x="6"  y="2" width="4" height="12" rx="1.5" fill="currentColor"/>
            <rect x="11" y="2" width="4" height="12" rx="1.5" fill="currentColor"/>
          </svg>
        </button>

        <button class="col-btn" data-col="4" title="4 columns" aria-label="4 columns">
          <svg viewBox="0 0 18 16" fill="none">
            <rect x="1"    y="2" width="3" height="12" rx="1.5" fill="currentColor"/>
            <rect x="5.5"  y="2" width="3" height="12" rx="1.5" fill="currentColor"/>
            <rect x="10"   y="2" width="3" height="12" rx="1.5" fill="currentColor"/>
            <rect x="14.5" y="2" width="3" height="12" rx="1.5" fill="currentColor"/>
          </svg>
        </button>

      </div><!-- /col-switcher -->

      <!-- Dark / Light toggle -->
      <label class="theme-toggle" title="Toggle theme" aria-label="Toggle dark / light mode">
        <input type="checkbox" id="themeToggle" />
        <div class="toggle-track"><span>🌙</span><span>☀️</span></div>
        <div class="toggle-thumb"></div>
      </label>

    </div><!-- /topbar-right -->
  </header>

  <!-- ══ CATEGORY PILLS ════════════════════════════════════════════ -->
  <nav id="categoryPanel" class="pill-panel" aria-label="Filter categories"></nav>

  <!-- ══ SECTION HEADER ════════════════════════════════════════════ -->
  <section class="prompt-header" aria-live="polite">
    <h2 id="categoryTitle">All Prompts</h2>
    <div id="promptCount" class="prompt-count"></div>
  </section>

  <!-- ══ CARD GRID ═════════════════════════════════════════════════ -->
  <main id="promptContainer" class="prompt-grid"></main>

  <!-- ══ LOAD MORE ═════════════════════════════════════════════════ -->
  <div class="load-more-zone">
    <button class="load-more-btn" id="loadMoreBtn">
      <span id="loadMoreLabel">Load More</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </button>
    <p class="load-more-info" id="loadMoreInfo"></p>
  </div>

  <!-- ══ FOOTER ════════════════════════════════════════════════════ -->
  <footer>
    <div class="footer-inner">

      <div class="footer-brand">
        <div class="logo-spark">✦</div>
        Prompt Gallery
      </div>

      <p class="footer-tagline">
        A curated community of AI image prompts.<br />
        Browse, copy, and get inspired every day.
      </p>

      <div class="social-row">
        <a href="https://www.instagram.com/shinxou" class="social-btn instagram" target="_blank" rel="noopener" aria-label="Instagram">

        </a>
        <a href="https://www.facebook.com/Shinoxu.02" class="social-btn facebook" target="_blank" rel="noopener" aria-label="Facebook">
          <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </a>
        <a href="mailto:W3b.sujoy@gmail.com" class="social-btn gmail" aria-label="Gmail">
          <svg viewBox="0 0 24 24"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>
        </a>
      </div>

      <div class="footer-divider"></div>
      <p class="footer-copy">
        © <span id="footerYear"></span> Prompt Gallery · All prompts are community submitted.
      </p>

    </div>
  </footer>

  <!-- ══ TOAST ═════════════════════════════════════════════════════ -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ══ PLUS / SUBMIT FAB ═════════════════════════════════════════ -->
  <a href="submit page/submit.html" class="fab-btn" aria-label="Submit a prompt" title="Submit a Prompt">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    <span class="fab-label">Submit</span>
  </a>

  <script src="script.js"></script>
</body>
</html>
